title: MSI Dropper Executes Whoami for Reconnaissance
id: ea7d0957-84bc-4832-bb0c-cace67c8e50b
status: experimental
description: An MSI installer (msiexec.exe) executed a temporary executable (MSI4FFD.tmp)
  which then spawned a command prompt (cmd.exe). The command prompt subsequently executed
  'whoami.exe' to gather system owner and user information. This process chain indicates
  initial access or execution via a potentially malicious MSI package, followed by
  reconnaissance to understand the current user context and privileges.
references:
- https://attack.mitre.org/techniques/T1033/
author: Autonomous Sysmon-Sigma Pipeline
date: 2026/09/15
tags:
- attack.t1033
- attack.execution
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|endswith: \cmd.exe
  selection_cli:
    CommandLine|contains:
    - whoami
  condition: selection_process and selection_cli
falsepositives:
- Legitimate software installation routines
- Administrative maintenance tasks
level: high
